{{define "content"}}
<div class="mt-8">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-gray-900">Masuk dengan WhatsApp</h2>
      <p class="text-gray-500 mt-2 text-sm">Kami akan mengirim kode OTP ke nomor WhatsApp Anda</p>
    </div>

    {{if .Tenant.WelcomeMessage}}
    <div class="bg-indigo-50 rounded-xl px-4 py-3 mb-6 text-sm text-indigo-800">
      {{.Tenant.WelcomeMessage}}
    </div>
    {{end}}

    <form method="POST" action="/{{.Tenant.Slug}}/login">
      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Nomor WhatsApp</label>
        <div class="flex">
          <span class="inline-flex items-center px-3 text-gray-500 bg-gray-50 border border-r-0 border-gray-200 rounded-l-xl text-sm">
            🇮🇩 +62
          </span>
          <input
            type="tel"
            name="phone"
            placeholder="8123456789"
            required
            class="flex-1 border border-gray-200 rounded-r-xl px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-base"
          >
        </div>
        <p class="text-xs text-gray-400 mt-1">Contoh: 08123456789 atau 628123456789</p>
      </div>

      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 rounded-xl transition-colors text-base">
        Kirim Kode OTP
      </button>
    </form>
  </div>

  <div class="text-center mt-6">
    <div class="inline-flex items-center gap-2 bg-green-50 text-green-700 rounded-full px-4 py-2 text-xs font-medium">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/>
      </svg>
      OTP dikirim via WhatsApp
    </div>
  </div>
</div>
{{end}}
