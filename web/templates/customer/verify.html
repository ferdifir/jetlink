{{define "content"}}
<div class="mt-8">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-gray-900">Masukkan Kode OTP</h2>
      {{if .Data}}
      <p class="text-gray-500 mt-2 text-sm">
        Kode telah dikirim ke WhatsApp
        <span class="font-semibold text-gray-900">{{(index .Data "phone")}}</span>
      </p>
      {{end}}
    </div>

    <form method="POST" action="/{{.Tenant.Slug}}/verify">
      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-700 mb-2 text-center">Kode OTP (6 digit)</label>
        <input
          type="text"
          name="code"
          maxlength="6"
          placeholder="000000"
          required
          autofocus
          class="w-full border border-gray-200 rounded-xl px-4 py-4 text-center text-3xl font-bold tracking-[0.5em] text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
        >
        <p class="text-xs text-gray-400 mt-2 text-center">Berlaku selama 5 menit</p>
      </div>

      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 rounded-xl transition-colors text-base mb-3">
        Verifikasi
      </button>

      <a href="/{{.Tenant.Slug}}/login"
        class="block text-center text-sm text-gray-500 hover:text-indigo-600 transition-colors">
        ← Kirim ulang OTP
      </a>
    </form>
  </div>
</div>
{{end}}
