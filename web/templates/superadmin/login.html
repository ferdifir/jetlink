{{define "content"}}
<div class="min-h-screen flex items-center justify-center -mt-6">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
      <div class="text-center mb-8">
        <div class="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
          <span class="text-2xl">⚡</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Jetlink Super Admin</h1>
        <p class="text-gray-500 text-sm mt-1">Platform Management</p>
      </div>

      <form method="POST" action="/superadmin/login">
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email</label>
          <input type="email" name="email" required placeholder="admin@jetlink.app"
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
          <input type="password" name="password" required placeholder="••••••••"
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition-colors">
          Masuk
        </button>
      </form>
    </div>
  </div>
</div>
{{end}}
